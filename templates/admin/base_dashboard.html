<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Admin{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
        }

        .sidebar {
            width: 240px;
            height: 100vh;
            background: #020617;
            position: fixed;
            padding: 20px;
        }

        .sidebar h2 {
            color: #38bdf8;
            margin-bottom: 30px;
        }

        .sidebar a {
            display: block;
            color: #94a3b8;
            text-decoration: none;
            padding: 10px;
            margin: 5px 0;
            border-radius: 8px;
        }

        .sidebar a:hover {
            background: #1e293b;
            color: white;
        }

        .main {
            margin-left: 260px;
            padding: 30px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
        }

        .btn-green { background: #22c55e; }
        .btn-red { background: #ef4444; }
        .btn-blue { background: #3b82f6; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #334155;
        }
    </style>
</head>

<body>

<div class="sidebar">
    <h2>Admin</h2>

    <a href="{% url 'admin_dashboard' %}">Dashboard</a>
    <a href="{% url 'manage_alumni' %}">Alumni</a>
    <a href="{% url 'manage_posts' %}">Posts</a>
    <a href="{% url 'manage_jobs' %}">Jobs</a>
    <a href="{% url 'manage_events' %}">Events</a>
    <a href="{% url 'logout' %}">Logout</a>
    
</div>


<div class="main">
    {% block content %}{% endblock %}
</div>

</body>
</html>
