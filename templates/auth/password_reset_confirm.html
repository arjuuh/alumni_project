<!DOCTYPE html>
<html>
<head>
    <title>Reset Password</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI';
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            color: #2a5298;
            margin-bottom: 20px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
        }

        .field {
            position: relative;
            margin-bottom: 20px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        input:focus {
            border-color: #2a5298;
            outline: none;
        }

        /* Instagram-style popup */
        .error-popup {
            position: absolute;
            top: -35px;
            left: 0;
            background: black;
            color: white;
            font-size: 12px;
            padding: 6px 10px;
            border-radius: 6px;
            white-space: nowrap;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #2a5298;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>Reset Password</h2>

    <form method="post">
        {% csrf_token %}

        <!-- New Password -->
        <div class="field">
            {% if form.new_password1.errors %}
                <div class="error-popup">
                    {{ form.new_password1.errors.0 }}
                </div>
            {% endif %}

            <label>New Password</label>
            {{ form.new_password1 }}
        </div>

        <!-- Confirm Password -->
        <div class="field">
            {% if form.new_password2.errors %}
                <div class="error-popup">
                    {{ form.new_password2.errors.0 }}
                </div>
            {% endif %}

            <label>Confirm Password</label>
            {{ form.new_password2 }}
        </div>

        <button type="submit">Update Password</button>
    </form>
</div>

</body>
</html>
