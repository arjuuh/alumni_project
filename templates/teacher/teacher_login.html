<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login - Alumni Portal</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #333;
        }

        .container {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.10);
            padding: 48px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, #667eea, #764ba2);
        }

        h2 {
            font-size: 28px;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .sub-text {
            font-size: 14px;
            color: #666;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .msg {
            margin-bottom: 16px;
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            text-align: left;
        }

        .msg-error {
            background: #ffe8e8;
            color: #b42318;
            border: 1px solid #f5c2c2;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input {
            width: 100%;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 16px;
            background: #667eea;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-sizing: border-box;
        }

        button:hover {
            background: #5a6fd8;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .home-link {
            display: inline-block;
            margin-top: 18px;
            text-decoration: none;
            font-size: 14px;
            color: #667eea;
            font-weight: 500;
        }

        .home-link:hover {
            text-decoration: underline;
        }

        .footer-note {
            margin-top: 16px;
            font-size: 13px;
            color: #777;
            line-height: 1.5;
        }

        @media (max-width: 480px) {
            .container {
                padding: 32px;
                margin: 16px;
            }

            h2 {
                font-size: 24px;
            }

            .sub-text {
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Teacher Login</h2>
        <p class="sub-text">Login using your department HOD credentials</p>

        {% if messages %}
            {% for message in messages %}
                <div class="msg msg-error">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Sign In</button>
        </form>

        <a href="/" class="home-link">← Back to Home</a>

        <div class="footer-note">
            Only authorized department teachers can access this portal.
        </div>
    </div>
</body>
</html>
